{% comment %}
  post-graph.html — Obsidian 스타일 Force-Directed Graph 뷰.

  - CDN의 force-graph 라이브러리(HTML5 Canvas 기반 2D)를 사용합니다.
  - assets/js/graph.json(빌드 시 생성)을 fetch 하여 노드/링크를 렌더링합니다.
  - 노드 클릭 시 node.id(포스트 URL)로 이동합니다.
  - 컨테이너 크기에 맞춰 반응형으로 크기가 조절됩니다.
{% endcomment %}

<div id="post-graph" class="post-graph"></div>

<style>
  .post-graph {
    position: relative;
    width: 100%;
    height: 70vh;
    min-height: 360px;
    border: 1px solid var(--border-color, rgba(128, 128, 128, 0.25));
    border-radius: 8px;
    overflow: hidden;
    background: var(--main-bg, transparent);
  }

  .post-graph canvas {
    display: block;
  }

  .post-graph__empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-muted-color, #888);
    font-size: 0.95rem;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/force-graph@1"></script>
<script>
  (function () {
    var container = document.getElementById('post-graph');
    if (!container || typeof ForceGraph === 'undefined') {
      return;
    }

    var dataUrl = '{{ "/assets/js/graph.json" | relative_url }}';

    // 현재 테마(라이트/다크)에 맞춰 캔버스 색을 결정합니다.
    function themeColors() {
      var styles = getComputedStyle(document.body);
      var text = styles.getPropertyValue('--text-color').trim() || '#333';
      var accent =
        styles.getPropertyValue('--link-color').trim() ||
        styles.getPropertyValue('--btn-share-color').trim() ||
        '#1d7dfa';
      var isDark =
        document.documentElement.getAttribute('data-bs-theme') === 'dark' ||
        document.documentElement.getAttribute('data-mode') === 'dark';
      return {
        text: text,
        node: accent,
        link: isDark ? 'rgba(200,200,200,0.25)' : 'rgba(80,80,80,0.25)'
      };
    }

    function initGraph(data) {
      if (!data || !data.nodes || data.nodes.length === 0) {
        container.innerHTML =
          '<div class="post-graph__empty">표시할 포스트가 없습니다.</div>';
        return;
      }

      var colors = themeColors();

      var Graph = ForceGraph()(container)
        .graphData(data)
        .nodeId('id')
        .nodeLabel('name')
        .nodeRelSize(4)
        .nodeVal('val')
        .linkColor(function () {
          return colors.link;
        })
        .linkWidth(1)
        .backgroundColor('rgba(0,0,0,0)')
        .onNodeClick(function (node) {
          // 요구사항: 노드 클릭 시 해당 포스트 URL(node.id)로 이동
          if (node && node.id) {
            window.location.href = node.id;
          }
        })
        .nodeCanvasObject(function (node, ctx, globalScale) {
          var radius = Math.sqrt(node.val || 1) * 3;

          ctx.beginPath();
          ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI, false);
          ctx.fillStyle = colors.node;
          ctx.fill();

          // 확대되었을 때만 라벨을 그려 가독성을 유지합니다.
          if (globalScale >= 1.2) {
            var label = node.name || node.id;
            var fontSize = 12 / globalScale;
            ctx.font = fontSize + 'px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillStyle = colors.text;
            ctx.fillText(label, node.x, node.y + radius + 1);
          }
        })
        .nodePointerAreaPaint(function (node, color, ctx) {
          var radius = Math.sqrt(node.val || 1) * 3;
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(node.x, node.y, radius + 2, 0, 2 * Math.PI, false);
          ctx.fill();
        });

      // 마우스 오버 시 커서를 포인터로 바꿔 클릭 가능함을 알립니다.
      Graph.onNodeHover(function (node) {
        container.style.cursor = node ? 'pointer' : null;
      });

      // 컨테이너 크기에 맞춰 반응형으로 리사이즈합니다.
      function resize() {
        Graph.width(container.clientWidth).height(container.clientHeight);
      }
      resize();

      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(resize).observe(container);
      } else {
        window.addEventListener('resize', resize);
      }
    }

    fetch(dataUrl)
      .then(function (res) {
        if (!res.ok) {
          throw new Error('graph.json 로드 실패: ' + res.status);
        }
        return res.json();
      })
      .then(initGraph)
      .catch(function (err) {
        console.error(err);
        container.innerHTML =
          '<div class="post-graph__empty">그래프 데이터를 불러오지 못했습니다.</div>';
      });
  })();
</script>
